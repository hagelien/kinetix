name: derived-registry-refresh

# Rebuilds the catalog-derived model registry every night and proposes it as a
# pull request, so a parameter curated into the database reaches the simulator
# within a day instead of waiting for someone to run `npm run kinetics:registry`.
#
# Why a pull request and not a live read: the derived tier is a committed,
# checksummed snapshot on purpose. Every run manifest names the release it
# resolved through, so a saved case replays to the same curve, a bad catalog
# edit reaches users only through a reviewable diff, and the offline consumer
# pins one fingerprinted release. This job keeps all of that and removes only
# the manual step. The pull request carries a plain summary of what changed
# (models gained or lost, grade moves), and the Codex gate merges it once its
# review is clean and `unit-tests` pass, like any other pull request.
#
# One secret is required beyond DATABASE_URL: REGISTRY_REFRESH_TOKEN, a
# fine-grained token with Contents and Pull requests read/write on this
# repository. GitHub does not start workflows for a pull request opened with the
# built-in GITHUB_TOKEN, so a pull request opened with it would never get the
# `unit-tests` run the gate requires and would sit unmerged. Without the token
# the job still rebuilds and validates, and reports the change in its summary.
#
# The `catalog-drift` job's weekly registry check stays as the alarm for the
# case this job cannot cover: a refresh pull request that fails review or CI.

on:
  schedule:
    # 03:17 UTC nightly — off the hour, so it does not queue behind every
    # other scheduled job on the platform.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: derived-registry-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # The rebuild reads the whole catalog in one transaction (~3 min locally);
    # the rest is the kinetics-core suite and a push.
    timeout-minutes: 25
    env:
      BRANCH: automation/derived-registry-refresh
      ARTIFACT: src/lib/kinetics-core/generated-registry.ts
    steps:
      # Credentials are not persisted: `npm ci` runs dependency install scripts,
      # and none of them should be able to read a push token out of .git/config.
      # The push step below passes the token explicitly instead.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install deps
        run: npm ci

      - name: Check secrets are configured
        id: guard
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REFRESH_TOKEN: ${{ secrets.REGISTRY_REFRESH_TOKEN }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::notice::DATABASE_URL secret is not set — skipping the registry refresh."
            echo "db=false" >> "$GITHUB_OUTPUT"
          else
            echo "db=true" >> "$GITHUB_OUTPUT"
          fi
          if [ -z "$REFRESH_TOKEN" ]; then
            echo "token=false" >> "$GITHUB_OUTPUT"
          else
            echo "token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the derived registry
        if: steps.guard.outputs.db == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          cp "$ARTIFACT" "$RUNNER_TEMP/before.ts"
          npm run kinetics:registry

      - name: Detect a change
        id: diff
        if: steps.guard.outputs.db == 'true'
        run: |
          if git diff --quiet -- "$ARTIFACT"; then
            echo "The catalog has not changed since the committed snapshot." >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Never propose a snapshot the engine rejects: the same checks the
      # kinetics-core workflow runs on a pull request, before one is opened.
      - name: Validate the rebuilt registry
        if: steps.diff.outputs.changed == 'true'
        run: |
          npx vitest run src/lib/kinetics-core
          npm run kinetics:provenance:check

      - name: Summarise the change
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Nightly rebuild of the catalog-derived model registry from the live catalog."
            echo "Generated by \`.github/workflows/derived-registry-refresh.yml\`; review it as data."
            echo
            npx tsx scripts/derived-registry-summary.ts "$RUNNER_TEMP/before.ts" "$ARTIFACT"
          } > "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the refresh pull request
        if: steps.diff.outputs.changed == 'true' && steps.guard.outputs.token == 'true'
        env:
          GH_TOKEN: ${{ secrets.REGISTRY_REFRESH_TOKEN }}
        run: |
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # An open refresh that already proposes exactly this snapshot needs no
          # new commit: pushing one would restart its CI and review for nothing.
          if git fetch --quiet "$remote" "$BRANCH" 2>/dev/null \
            && git diff --quiet FETCH_HEAD -- "$ARTIFACT"; then
            echo "The open refresh already proposes this snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$ARTIFACT"
          git commit --quiet -m "Refresh the derived registry from the catalog"
          # The branch belongs to this job alone and always starts from main, so
          # replacing it is safe and keeps the pull request to one commit.
          git push --quiet --force "$remote" "HEAD:refs/heads/$BRANCH"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/summary.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" \
              --title "Refresh the derived registry from the catalog" \
              --body-file "$RUNNER_TEMP/summary.md"
          fi

      - name: Explain why no pull request was opened
        if: steps.diff.outputs.changed == 'true' && steps.guard.outputs.token != 'true'
        run: |
          echo "::warning::The registry changed, but REGISTRY_REFRESH_TOKEN is not set, so no pull request was opened. See the job summary for what changed."
